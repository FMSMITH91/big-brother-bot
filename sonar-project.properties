# Used by the CI-based SonarCloud analysis (the "coverage" job in .github/workflows/tests.yml), which only runs when
# the repository variable SONAR_CI_ANALYSIS is "true". SonarCloud's Automatic Analysis ignores this file.
sonar.organization=fmsmith91
sonar.projectKey=FMSMITH91_big-brother-bot
sonar.projectName=big-brother-bot

sonar.sources=b3
sonar.tests=tests
sonar.exclusions=b3/tools/debug/**,b3/docs/**
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=coverage.xml
