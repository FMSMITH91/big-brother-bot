# Geolocation plugin: finds the country (and, with the online services, the city, region and ISP) of each player
# from their IP address. Other plugins use it: geowelcome, countryfilter, location.
#
# To use this file, list the plugin in the [plugins] section of b3.ini:
#   geolocation: @conf/plugin_geolocation.ini
# Without this file the plugin uses the defaults below.

[settings]
## Which services to ask, in order, separated by commas. The first one that answers wins.
##   ipwho.is : online (HTTPS), country, region, city, ISP
##   ipapi.co : online (HTTPS), country, region, city, ISP
##   mmdb     : offline, the country database in mmdb_file below (IPv4 and IPv6). Skipped if the file is missing.
##   maxmind  : offline, the old database bundled with B3 (2015, IPv4 only, country only)
## The online services see the IP address of every player who connects. To keep player IP addresses on this
## machine, use only the offline ones: "mmdb, maxmind". To use only what your firewall lets B3 reach, name just
## that service.
## Default: ipwho.is, ipapi.co, mmdb, maxmind
geolocators: ipwho.is, ipapi.co, mmdb, maxmind

## The offline country database used by "mmdb": a MaxMind DB (.mmdb) file. B3 never downloads it.
## Recommended: DB-IP "IP to Country Lite" (free, no account, updated monthly, licence CC BY 4.0):
##   https://db-ip.com/db/download/ip-to-country-lite
##   download dbip-country-lite-YYYY-MM.mmdb.gz, check its SHA1 against the page, unzip it to this path,
##   and replace it every month or so (B3 warns in b3.log when the file is over 90 days old).
##   IP Geolocation by DB-IP (https://db-ip.com), licensed under CC BY 4.0.
## MaxMind GeoLite2-Country.mmdb (free account and licence key needed) works too.
## @home is B3's data folder (~/.b3, or %USERPROFILE%\.b3 on Windows).
## Default: @home/dbip-country-lite.mmdb
mmdb_file: @home/dbip-country-lite.mmdb
