version: 2
updates:
  # Python dependencies: requirements.txt, optional-requirements.txt and test-requirements.txt in the root, and the
  # hash-locked CI tools in .github (ci-requirements.in -> ci-requirements.txt, regenerated by Dependabot)
  - package-ecosystem: pip
    directories:
      - "/"
      - "/.github"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR for all minor/patch updates; major versions still get their own PR so they can be reviewed
      python-minor-and-patch:
        update-types: [minor, patch]
  # versions of the GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
