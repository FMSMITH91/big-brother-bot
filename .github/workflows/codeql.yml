name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # weekly, to pick up new CodeQL queries even when the code does not change
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security queries only: code quality is covered by ruff and SonarCloud (the security-and-quality suite
          # reported ~1000 style notes on this 2008-era code base, burying the security results)
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
