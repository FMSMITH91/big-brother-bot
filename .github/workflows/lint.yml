name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # the lock file below was resolved for this version
          python-version: "3.14"
      # exact versions with hashes (regenerate .github/ci-requirements.txt from ci-requirements.in with
      # pip-compile --generate-hashes --allow-unsafe), wheels only so no package setup script runs
      - name: Install tools
        run: "pip install --only-binary :all: --require-hashes -r .github/ci-requirements.txt"
      # syntax errors, undefined names, invalid comparisons, redefined names
      - name: ruff
        run: ruff check --select E9,F63,F7,F82,F811 --target-version py39 --exclude b3/tools/debug b3 b3_run.py b3_debug.py setup.py examples
      # no compile warnings, and every file parses with the oldest supported Python (3.9)
      - name: syntax
        run: python scripts/check_syntax.py .
      # every test can fail: no test function whose body is only `pass`
      - name: no empty tests
        run: python scripts/check_tests.py tests
      # known vulnerabilities in the dependencies
      - name: pip-audit
        run: pip-audit -r requirements.txt -r optional-requirements.txt --progress-spinner off
